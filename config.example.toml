# bluetti-controller — example configuration (ROADMAP.md §9).
#
# Copy to `config.toml` (gitignored) or `/etc/bluetti-controller/config.toml`
# and fill in your own station addresses. Never commit the real file: MAC
# addresses and keys stay local (RULES.md golden rule #3). The addresses below
# are placeholders.

[general]
poll_interval_secs = 60
timezone = "Europe/Kyiv"

[storage]
# `serve` creates and migrates this SQLite file; its directory must exist.
path = "/var/lib/bluetti-controller/data.db"
raw_retention_days = 30

[web]
# `serve` serves the status page `/`, `/telemetry`, the JSON API, `/events`
# (SSE) and `/healthz` here. Bind to a LAN address only (ROADMAP.md §8.3): GET
# has no auth, and the host firewall must block other networks.
listen = "0.0.0.0:8080"
# Optional bearer token for POST /api/polling/pause. Unset: the POST is open
# (it only pauses polling for up to 60 min, never writes to a station). Set: a
# non-empty string, sent as `Authorization: Bearer <token>`; never commit it.
# token = "change-me"

[ble]
adapter = "hci0"
connect_timeout_secs = 15
request_timeout_secs = 5
connect_attempts = 3

[crypto]
# Static keys for encrypted (BLUETTE/BLUETTF) stations, ROADMAP.md §4.4. Never
# commit. The file holds exactly three hex strings (no `0x`, either case):
#   local_aes_key         = "<32 hex digits>"   16-byte AES key
#   host_signing_key      = "<64 hex digits>"   P-256 private scalar, big-endian
#   station_verifying_key = "<130 hex digits>"  SEC1 uncompressed point, `04…`
keys_file = "/etc/bluetti-controller/keys.toml"

[metrics]
grid_voltage_min = 180.0
debounce_samples = 2
usable_capacity_factor = 0.85

[control]
enabled = false                    # RULES.md golden rule #2 — never default true

[[station]]
name = "router"
model = "EB3A"
address = "AA:BB:CC:DD:EE:01"
grid_sensor = true

[[station]]
name = "mobile"
model = "AC180"
address = "AA:BB:CC:DD:EE:02"
grid_sensor = false

[[station]]
name = "living-room"
model = "Elite200V2"
address = "AA:BB:CC:DD:EE:03"
grid_sensor = true
