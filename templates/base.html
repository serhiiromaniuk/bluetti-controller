<!doctype html>
<html lang="en" data-theme="dark">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Bluetti{% endblock %}</title>
<link rel="icon" href="data:,">
<script src="/assets/theme.js?v={{ crate::BUILD }}"></script>
{% block head %}{% endblock %}

</head>

</html>
