[package]
name = "bluetti-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local monitor for Bluetti power stations over Bluetooth LE"
publish = false

# Dependencies are added per milestone (see ROADMAP.md §12); versions per §4.9.
# `src/protocol/` is pure: std + RustCrypto, no I/O or async; `bluer` is imported only under
# `src/transport/`.
[dependencies]
aes = "0.9.3"
axum = "0.8.9"
anyhow = "1.0.104"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
md-5 = "0.11.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# `test-util` lets `start_paused` tests pin backoff timing in virtual time.
tokio = { version = "1.53.2", features = ["test-util"] }
